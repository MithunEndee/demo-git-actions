# Set the lowest supported version to ensure compatibility
target-version = "py37" 
line-length = 88

[lint]
# E, W: pycodestyle (PEP8)
# F: Pyflakes (Logic/Syntax)
# I: Isort (Professional Import Sorting)
# C90: McCabe (Complexity Control)
# B: Bugbear (Bug Prevention)
# UP: Pyupgrade (Modernizes code safely for 3.7+)
# PLE: Pylint Errors
select = ["E", "W", "F", "I", "C90", "B", "UP", "PLE"]

ignore = []

# Enable preview mode to catch spacing issues like E231 (missing whitespace after comma)
preview = true

# This ensures Ruff doesn't remove code that might be needed for older versions
fixable = ["ALL"]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
# Standard practice: don't complain about unused imports in your library's entry point
"__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
# This keeps the code consistent regardless of the OS (Windows/Mac/Linux)
line-ending = "auto"

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]