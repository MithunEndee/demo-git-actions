# Example 2: Manual Triggering
# File: .github/workflows/manual-deploy.yml

name: Manual Deployment

# MANUAL TRIGGER - Add a "Run workflow" button in GitHub UI
on:
  workflow_dispatch:
    # Optional: Add input parameters that user can fill
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: 'staging'
      
      version:
        description: 'Version to deploy'
        required: true
        type: string
        default: 'latest'
      
      enable_debug:
        description: 'Enable debug logging'
        required: false
        type: boolean
        default: false
      
      deploy_reason:
        description: 'Reason for deployment'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Show inputs
        run: |
          echo "Deploying to: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"
          echo "Debug enabled: ${{ inputs.enable_debug }}"
          echo "Reason: ${{ inputs.deploy_reason }}"
      
      - name: Deploy
        run: |
          echo "Deploying to ${{ inputs.environment }}..."
          # Your deployment commands here
          
          if [ "${{ inputs.enable_debug }}" == "true" ]; then
            echo "Debug mode enabled"
          fi