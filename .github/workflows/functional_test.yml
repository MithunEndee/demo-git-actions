name: Functional Tests

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      token:
        description: "Endee Serverless API token. Leave blank to use the ENDEE_TOKEN secret."
        required: false
        default: ""
        type: string
      base_url:
        description: "API base URL override (e.g. http://localhost:8080/api/v1). Leave blank to derive from token."
        required: false
        default: ""
        type: string

jobs:
  functional-test:
    name: Endee Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      checks: write

    # Global environment mapping for the entire job lifecycle
    env:
      ENDEE_TOKEN: ${{ inputs.token || secrets.ENDEE_TOKEN }}
      ENDEE_BASE_URL: ${{ inputs.base_url || secrets.ENDEE_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-html pytest-timeout numpy pytest-github-actions-annotate-failures

      - name: Verify server connectivity
        id: verify-conn
        # Gracefully skip if a fork PR has no access to target environment secrets
        if: env.ENDEE_TOKEN != ''
        run: |
          python - <<'PYEOF'
          import os, sys
          from endee import Endee

          token    = os.environ.get("ENDEE_TOKEN")
          base_url = os.environ.get("ENDEE_BASE_URL")

          c = Endee(token=token)
          if base_url:
              c.set_base_url(base_url)

          try:
              indexes = c.list_indexes()
              print(f"Connected successfully. Existing indexes: {len(indexes)}")
          except Exception as e:
              print(f"Connection failed: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Run functional tests
        if: env.ENDEE_TOKEN != '' && (steps.verify-conn.outcome == 'success')
        run: |
          pytest tests/ \
            -v \
            --timeout=120 \
            --tb=short \
            -p no:warnings \
            --junit-xml=test-results.xml \
            --html=test-report.html \
            --self-contained-html

      - name: Write test summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BRANCH_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET, os, sys

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")
          commit_sha   = os.environ.get("COMMIT_SHA", "unknown")[:7]
          commit_url   = os.environ.get("COMMIT_URL", "")
          branch       = os.environ.get("BRANCH", "")
          branch_url   = os.environ.get("BRANCH_URL", "")
          pr_number    = os.environ.get("PR_NUMBER", "")
          pr_url       = os.environ.get("PR_URL", "")
          run_url      = os.environ.get("RUN_URL", "")
          token_check  = os.environ.get("ENDEE_TOKEN", "")

          if not summary_file:
              sys.exit(0)

          def write_out(content):
              with open(summary_file, "a") as f:
                  f.write(content)

          if not token_check:
              write_out(f"## Endee Functional Test Report\n\n **Skipped**: Internal environment secrets are inaccessible from this fork pipeline context.")
              sys.exit(0)

          try:
              tree = ET.parse("test-results.xml")
              root = tree.getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  suite = root

              total    = int(suite.get("tests",    0))
              failures = int(suite.get("failures", 0))
              errors   = int(suite.get("errors",   0))
              skipped  = int(suite.get("skipped",  0))
              passed   = total - failures - errors - skipped
              elapsed  = float(suite.get("time",   0))

              mins, secs = divmod(int(elapsed), 60)
              duration = f"{mins}m {secs}s" if mins else f"{secs}s"

              lines = [
                  "## Endee Functional Test Report",
                  "",
                  "**Commit:** " + f"[`{commit_sha}`]({commit_url})" +
                      (f" | **Branch:** [`{branch}`]({branch_url})" if branch else "") +
                      (f" | **PR:** [#{pr_number}]({pr_url})" if pr_number else "") +
                      f" | **[View Action Logs]({run_url})**",
                  "",
                  "| Result  | Count |",
                  "|---------|------:|",
                  f"| Passed  | {passed} |",
                  f"| Failed  | {failures} |",
                  f"| Errors  | {errors} |",
                  f"| Skipped | {skipped} |",
                  f"| **Total** | **{total}** |",
                  "",
                  f"**Duration:** {duration}",
                  "",
              ]

              failed_cases  = []
              skipped_cases = []
              for tc in suite.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = tc.find(tag)
                      if node is not None:
                          name      = tc.get("name", "unknown")
                          classname = tc.get("classname", "")
                          msg       = (node.get("message") or node.text or "").strip().split("\n")[0][:200]
                          failed_cases.append((classname, name, msg))
                  skip_node = tc.find("skipped")
                  if skip_node is not None:
                      name      = tc.get("name", "unknown")
                      classname = tc.get("classname", "")
                      reason    = (skip_node.get("message") or "No reason given").strip()
                      skipped_cases.append((classname, name, reason))

              if failed_cases:
                  lines += [
                      "<details open>",
                      f"<summary> Failed tests ({len(failed_cases)})</summary>",
                      "",
                      "| Test | Reason |",
                      "|------|--------|",
                  ]
                  for classname, name, msg in failed_cases:
                      lines.append(f"| `{classname}::{name}` | {msg} |")
                  lines += ["", "</details>", ""]

              if skipped_cases:
                  from collections import defaultdict
                  by_reason = defaultdict(list)
                  for classname, name, reason in skipped_cases:
                      by_reason[reason].append(f"`{classname}::{name}`")

                  lines += [
                      "<details>",
                      f"<summary> Skipped tests ({len(skipped_cases)})</summary>",
                      "",
                  ]
                  for reason, names in by_reason.items():
                      lines.append(f"**Reason:** {reason}")
                      lines.append("")
                      for n in names:
                          lines.append(f"- {n}")
                      lines.append("")
                  lines += ["</details>", ""]

              write_out("\n".join(lines) + "\n")

          except FileNotFoundError:
              write_out(f"## Endee Functional Test Report\n\n `test-results.xml` not found. Testing pipeline failed prematurely.\n")
          except Exception as exc:
              print(f"Summary generation failed: {exc}", file=sys.stderr)
          PYEOF

      - name: Upload test artifacts
        if: always() && env.ENDEE_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: endee-functional-test-results
          path: |
            test-report.html
            test-results.xml
          retention-days: 7