name: Functional Tests

# =============================================================================
# HOW TO USE
#
# Trigger manually: GitHub Actions, Functional Tests, Run workflow
#
# SERVERLESS MODE  (token provided)
#   Provide an API token from the Endee Serverless (Scale plan to test all features).
#   The client derives the correct API endpoint from the token automatically.
#   Leave base_url empty.
#
# OSS / SELF-HOSTED MODE  (no token)
#   Leave token empty.
#   The workflow pulls the official Docker image (endeeio/endee-server:latest)
#   and starts a local server on port 8080 with authentication disabled.
#   base_url defaults to http://127.0.0.1:8080/api/v1.
#   To target an already-running server on another host, set base_url
#   (e.g. http://0.0.0.0:8080/api/v1) and leave token empty.
#
# =============================================================================

on:
  pull_request:
    branches:
      - main  # Triggers automatically when a PR targets the main branch
  workflow_dispatch:
    inputs:
      token:
        description: "[OPTIONAL] Endee Serverless API token. Leave blank to run in OSS mode (local Docker)."
        required: false
        default: ""
        type: string

      base_url:
        description: "[OPTIONAL] API base URL override (e.g. http://0.0.0.0:8080/api/v1). Leave blank to use the mode default."
        required: false
        default: ""
        type: string

jobs:
  functional-test:
    name: Endee Functional Tests
    runs-on: ubuntu-latest

    steps:
      - name: Detect run mode
        id: mode
        run: |
          if [ -z "${{ inputs.token }}" ]; then
            echo "mode=oss" >> "$GITHUB_OUTPUT"
            echo "OSS mode: will start endeeio/endee-server:latest via Docker"
          else
            echo "mode=serverless" >> "$GITHUB_OUTPUT"
            echo "Serverless mode: will connect to Endee Serverless with provided token"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "[OSS] Pull Endee server image"
        if: steps.mode.outputs.mode == 'oss'
        run: docker pull endeeio/endee-server:latest

      - name: "[OSS] Start Endee server container"
        if: steps.mode.outputs.mode == 'oss'
        run: |
          docker run -d \
            --ulimit nofile=100000:100000 \
            -p 8080:8080 \
            -e NDD_AUTH_TOKEN="" \
            -e NDD_NUM_THREADS=2 \
            --name endee-oss \
            endeeio/endee-server:latest

          echo "Container started. Waiting for server to become ready..."

      - name: "[OSS] Wait for server to become ready"
        if: steps.mode.outputs.mode == 'oss'
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            BASE="${{ inputs.base_url }}"
          else
            BASE="http://127.0.0.1:8080/api/v1"
          fi

          HEALTH="$BASE/health"
          echo "Polling $HEALTH for up to 60 seconds..."

          for i in $(seq 1 30); do
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" "$HEALTH" 2>/dev/null || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "Server is ready after $((i * 2))s"
              exit 0
            fi
            echo "  Attempt $i/30 - HTTP $HTTP - retrying in 2s..."
            sleep 2
          done

          echo "::error::Server did not become ready within 60 seconds."
          echo "Container logs:"
          docker logs endee-oss 2>&1
          exit 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-html pytest-timeout numpy

      - name: Verify server connectivity
        env:
          ENDEE_TOKEN:    ${{ inputs.token }}
          ENDEE_BASE_URL: ${{ inputs.base_url }}
        run: |
          python - <<'PYEOF'
          import os, sys
          from endee import Endee

          token    = os.environ.get("ENDEE_TOKEN")    or None  # empty string treated as unset
          base_url = os.environ.get("ENDEE_BASE_URL") or None

          c = Endee(token=token)
          if base_url:
              c.set_base_url(base_url)

          try:
              indexes = c.list_indexes()
              print(f"Connected successfully. Existing indexes: {len(indexes)}")
          except Exception as e:
              print(f"Connection failed: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      # === Run the full functional test suite ===
      #  --junit-xml  machine-readable results consumed by the summary step
      #  --html       downloadable self-contained HTML report uploaded as artifact
      - name: Run functional tests
        id: pytest
        env:
          ENDEE_TOKEN:    ${{ inputs.token }}
          ENDEE_BASE_URL: ${{ inputs.base_url }}
        run: |
          pytest tests/ \
            -v \
            --timeout=120 \
            --tb=short \
            -p no:warnings \
            --junit-xml=test-results.xml \
            --html=test-report.html \
            --self-contained-html

      # === Write test summary to the Actions run page ===
      #  Visible at: Actions, run page, Summary tab
      - name: Write test summary
        if: always()
        run: |
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET, os, sys

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if not summary_file:
              print("GITHUB_STEP_SUMMARY not set - skipping summary")
              sys.exit(0)

          try:
              tree = ET.parse("test-results.xml")
              root = tree.getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  suite = root

              total    = int(suite.get("tests",    0))
              failures = int(suite.get("failures", 0))
              errors   = int(suite.get("errors",   0))
              skipped  = int(suite.get("skipped",  0))
              passed   = total - failures - errors - skipped
              elapsed  = float(suite.get("time",   0))
              bad      = failures + errors

              mins, secs = divmod(int(elapsed), 60)
              duration = f"{mins}m {secs}s" if mins else f"{secs}s"

              lines = [
                  f"## Endee - Functional Test Report",
                  "",
                  "| Result  | Count |",
                  "|---------|------:|",
                  f"| Passed  | {passed} |",
                  f"| Failed  | {failures} |",
                  f"| Errors  | {errors} |",
                  f"| Skipped | {skipped} |",
                  f"| **Total**   | **{total}** |",
                  "",
                  f"**Duration:** {duration}",
                  "",
              ]

              # Collect every failed / errored test case with full message
              failed_cases = []
              for tc in suite.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = tc.find(tag)
                      if node is not None:
                          name      = tc.get("name", "unknown")
                          classname = tc.get("classname", "")
                          msg       = (node.get("message") or node.text or "").strip().split("\n")[0][:200]
                          failed_cases.append((classname, name, msg))

              if failed_cases:
                  lines += [
                      f"<details>",
                      f"<summary>Failed tests ({len(failed_cases)})</summary>",
                      "",
                      "| Test | Reason |",
                      "|------|--------|",
                  ]
                  for classname, name, msg in failed_cases:
                      lines.append(f"| `{classname}::{name}` | {msg} |")
                  lines += ["", "</details>", ""]

              with open(summary_file, "a") as f:
                  f.write("\n".join(lines) + "\n")

              print(f"Summary written: {passed}/{total} passed in {duration}")

          except FileNotFoundError:
              with open(summary_file, "a") as f:
                  f.write("## Functional Test Results\n\n"
                          "test-results.xml not found — pytest may not have run.\n")
          except Exception as exc:
              print(f"Summary generation failed: {exc}", file=sys.stderr)
          PYEOF

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endee-functional-test-results
          path: |
            test-report.html
            test-results.xml
          retention-days: 30

      - name: "[OSS] Print server logs on failure"
        if: steps.mode.outputs.mode == 'oss' && failure()
        run: docker logs endee-oss 2>&1 || true
