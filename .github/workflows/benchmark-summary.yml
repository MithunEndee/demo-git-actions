# Workflow: Display Results in GitHub UI
name: Benchmark with Job Summary

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run benchmarks
        id: benchmark
        run: |
          python -c "
          import json
          import time
          import random
          import os
          
          results = {
              'timestamp': time.strftime('%Y-%m-%d %H:%M:%S'),
              'benchmarks': [
                  {'name': 'Quick Sort', 'time': round(random.uniform(0.1, 1.0), 3), 'memory_mb': random.randint(10, 100)},
                  {'name': 'Merge Sort', 'time': round(random.uniform(0.1, 1.0), 3), 'memory_mb': random.randint(10, 100)},
                  {'name': 'Heap Sort', 'time': round(random.uniform(0.1, 1.0), 3), 'memory_mb': random.randint(10, 100)},
                  {'name': 'Bubble Sort', 'time': round(random.uniform(1.0, 2.0), 3), 'memory_mb': random.randint(10, 100)},
              ]
          }
          
          # Save results
          with open('results.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          # Output for next steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'avg_time={sum(b[\"time\"] for b in results[\"benchmarks\"]) / len(results[\"benchmarks\"])}\n')
          
          print('✅ Benchmarks completed!')
          "
      
      - name: Create Job Summary
        run: |
          python -c "
          import json
          import os
          
          with open('results.json') as f:
              results = json.load(f)
          
          # Write to GitHub Step Summary
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as f:
              f.write('# 📊 Benchmark Results\n\n')
              f.write(f'**Run Date:** {results[\"timestamp\"]}\n')
              f.write(f'**Workflow Run:** #{os.environ[\"GITHUB_RUN_NUMBER\"]}\n\n')
              
              f.write('## 🏆 Performance Metrics\n\n')
              f.write('| Algorithm | Time (s) | Memory (MB) | Rating |\n')
              f.write('|-----------|----------|-------------|--------|\n')
              
              for b in results['benchmarks']:
                  rating = '🟢 Fast' if b['time'] < 0.5 else '🟡 Medium' if b['time'] < 1.0 else '🔴 Slow'
                  f.write(f'| {b[\"name\"]} | {b[\"time\"]:.3f} | {b[\"memory_mb\"]} | {rating} |\n')
              
              f.write('\n## 📈 Statistics\n\n')
              times = [b['time'] for b in results['benchmarks']]
              f.write(f'- **Average Time:** {sum(times)/len(times):.3f}s\n')
              f.write(f'- **Fastest:** {min(times):.3f}s\n')
              f.write(f'- **Slowest:** {max(times):.3f}s\n')
              
              f.write('\n## 💡 Recommendations\n\n')
              fastest = min(results['benchmarks'], key=lambda x: x['time'])
              f.write(f'✅ **Best Performance:** {fastest[\"name\"]} ({fastest[\"time\"]:.3f}s)\n')
              
              f.write('\n---\n')
              f.write(f'*Generated by GitHub Actions on {results[\"timestamp\"]}*\n')
          "
      
      - name: Print to terminal
        run: |
          echo "========================================="
          echo "📊 BENCHMARK RESULTS"
          echo "========================================="
          cat results.json
          echo ""
          echo "Average time: ${{ steps.benchmark.outputs.avg_time }}s"