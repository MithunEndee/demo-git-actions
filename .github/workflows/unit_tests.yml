name: LlamaIndex Unit Tests

# on: [push, pull_request]
on: workflow_dispatch

jobs:
  unit-test:
    name: LlamaIndex Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest pytest-mock pytest-timeout

      - name: Run unit tests
        run: pytest -m unit -v --timeout=60 --tb=short -p no:warnings --junit-xml=test-results.xml

      - name: Write job summary
        if: always()
        run: |
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET, os, sys

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if not summary_file:
              sys.exit(0)

          def write(content):
              with open(summary_file, "a") as f:
                  f.write(content)

          try:
              tree  = ET.parse("test-results.xml")
              root  = tree.getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  suite = root

              total    = int(suite.get("tests",    0))
              failures = int(suite.get("failures", 0))
              errors   = int(suite.get("errors",   0))
              skipped  = int(suite.get("skipped",  0))
              passed   = total - failures - errors - skipped
              elapsed  = float(suite.get("time",   0))
              mins, secs = divmod(int(elapsed), 60)
              duration = f"{mins}m {secs}s" if mins else f"{secs}s"

              lines = [
                  f"## LlamaIndex Unit Test Results (Python ${{ matrix.python-version }})",
                  "",
                  "| Result   | Count |",
                  "|----------|------:|",
                  f"| Passed   | {passed} |",
                  f"| Failed   | {failures} |",
                  f"| Errors   | {errors} |",
                  f"| Skipped  | {skipped} |",
                  f"| **Total** | **{total}** |",
                  "",
                  f"**Duration:** {duration}",
                  "",
              ]

              failed_cases  = []
              skipped_cases = []
              for tc in suite.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = tc.find(tag)
                      if node is not None:
                          name = tc.get("name", "unknown")
                          cls  = tc.get("classname", "")
                          msg  = (node.get("message") or node.text or "").strip().split("\n")[0][:200]
                          failed_cases.append((cls, name, msg))
                  skip_node = tc.find("skipped")
                  if skip_node is not None:
                      name   = tc.get("name", "unknown")
                      cls    = tc.get("classname", "")
                      reason = (skip_node.get("message") or "No reason given").strip()
                      skipped_cases.append((cls, name, reason))

              if failed_cases:
                  lines += [
                      "<details>",
                      f"<summary>Failed tests ({len(failed_cases)})</summary>",
                      "",
                      "| Test | Reason |",
                      "|------|--------|",
                  ]
                  for cls, name, msg in failed_cases:
                      lines.append(f"| `{cls}::{name}` | {msg} |")
                  lines += ["", "</details>", ""]

              if skipped_cases:
                  from collections import defaultdict
                  by_reason = defaultdict(list)
                  for cls, name, reason in skipped_cases:
                      by_reason[reason].append(f"`{cls}::{name}`")

                  lines += [
                      "<details>",
                      f"<summary>Skipped tests ({len(skipped_cases)})</summary>",
                      "",
                  ]
                  for reason, names in by_reason.items():
                      lines.append(f"**Reason:** {reason}")
                      lines.append("")
                      for n in names:
                          lines.append(f"- {n}")
                      lines.append("")
                  lines += ["</details>", ""]

              write("\n".join(lines) + "\n")
              print(f"Summary written: {passed}/{total} passed in {duration}")

          except FileNotFoundError:
              write("## Test Report\n\n`test-results.xml` not found - pytest may not have run.\n")
          except Exception as exc:
              print(f"Summary generation failed: {exc}", file=sys.stderr)
          PYEOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llamaindex-unit-test-results-${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 3
